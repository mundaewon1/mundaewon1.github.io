코드는:

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문대원 포트폴리오</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 100px auto;
            padding: 50px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #666;
        }

        .projects {
            margin-top: 50px;
            text-align: left;
        }

        .project {
            padding: 20px;
            margin-top: 15px;
            background: #f7f7f7;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>문대원</h1>
        <p>Backend Developer Portfolio</p>

        <div class="projects">
            <h2>Projects</h2>

            <div class="project">
                <h3>MOIT</h3>
                <p>Spring Boot 기반 모임 관리 및 Q&A 프로젝트</p>
            </div>

            <div class="project">
                <h3>Portfolio</h3>
                <p>앞으로 프로젝트와 기술 스택을 정리할 예정입니다.</p>
            </div>
        </div>
    </div>

</body>
</html>
